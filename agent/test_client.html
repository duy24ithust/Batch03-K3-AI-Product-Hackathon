<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLearn AI Agent — Chat Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f0f0;
            height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 280px;
            background: white;
            border-right: 1px solid #e0e0e0;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.05);
        }

        .sidebar h2 {
            color: #333;
            font-size: 16px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: #666;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-top: 10px;
            width: 100%;
            text-align: center;
        }

        .status-badge.online {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.offline {
            background: #f8d7da;
            color: #721c24;
        }

        .status-badge.loading {
            background: #fff3cd;
            color: #856404;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 20px;
            border-bottom: 1px solid #e0e0e0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: #f0f0f0;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        .message-type {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
            opacity: 0.7;
        }

        .message.bot .message-type {
            color: #666;
        }

        .message.user .message-type {
            color: rgba(255, 255, 255, 0.8);
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #999;
            animation: typingAnimation 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingAnimation {
            0%, 60%, 100% {
                opacity: 0.5;
            }
            30% {
                opacity: 1;
            }
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #e0e0e0;
            background: white;
            display: flex;
            gap: 10px;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        .input-area textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.1);
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            align-self: flex-end;
            font-size: 13px;
        }

        .input-area button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        .input-area button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .citations {
            margin-top: 8px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            font-size: 12px;
            color: #666;
        }

        .citations strong {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        .citation-item {
            display: block;
            margin-bottom: 3px;
            font-family: 'Courier New', monospace;
        }

        .suggestions {
            margin-top: 12px;
            padding: 12px;
            background: #f9f9f9;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .suggestions strong {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 13px;
        }

        .suggestion-list {
            list-style: none;
        }

        .suggestion-list li {
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid #eee;
            font-size: 13px;
            color: #555;
        }

        .suggestion-list li:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .message-debug {
            font-size: 11px;
            opacity: 0.6;
            margin-top: 4px;
            font-family: 'Courier New', monospace;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
            }

            .message-bubble {
                max-width: 85%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>⚙️ Settings</h2>

            <div class="form-group">
                <label>API Endpoint</label>
                <input type="text" id="apiEndpoint" value="http://localhost:8000">
            </div>

            <div class="form-group">
                <label>Session ID</label>
                <input type="text" id="sessionId" value="test-session-1">
            </div>

            <div class="form-group">
                <label>Lesson ID</label>
                <input type="text" id="lessonId" value="lesson-01">
            </div>

            <div class="form-group">
                <label>Slide ID (optional)</label>
                <input type="text" id="slideId" placeholder="e.g., slide-001">
            </div>

            <div id="status" class="status-badge offline">🔴 Offline</div>

            <button onclick="clearChat()" style="width: 100%; margin-top: 20px; padding: 10px; background: #f0f0f0; color: #333; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12px;">
                Clear Chat
            </button>
        </div>

        <!-- Chat -->
        <div class="chat-container">
            <div class="chat-header">
                <h1>🤖 VLearn AI Agent</h1>
                <p>Chat with AI tutor — powered by LangGraph</p>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                <textarea id="messageInput" placeholder="Ask a question about the course..." rows="2"></textarea>
                <button onclick="sendMessage()" id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const API_ENDPOINT = document.getElementById('apiEndpoint');
        const SESSION_ID = document.getElementById('sessionId');
        const LESSON_ID = document.getElementById('lessonId');
        const SLIDE_ID = document.getElementById('slideId');
        const MESSAGE_INPUT = document.getElementById('messageInput');
        const MESSAGES = document.getElementById('messages');
        const STATUS = document.getElementById('status');
        const SEND_BTN = document.getElementById('sendBtn');

        let currentResponse = null;

        function addMessage(text, isUser = false, type = 'user') {
            const div = document.createElement('div');
            div.className = `message ${isUser ? 'user' : 'bot'}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            if (type !== 'user') {
                const typeLabel = document.createElement('div');
                typeLabel.className = 'message-type';
                typeLabel.textContent = type;
                bubble.appendChild(typeLabel);
            }

            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            bubble.appendChild(textDiv);

            div.appendChild(bubble);
            MESSAGES.appendChild(div);
            MESSAGES.scrollTop = MESSAGES.scrollHeight;

            return div;
        }

        function updateLastMessage(text) {
            const lastMessage = MESSAGES.lastElementChild;
            if (lastMessage && lastMessage.querySelector('.message-bubble')) {
                const content = lastMessage.querySelector('.message-bubble');
                const textDiv = content.querySelector('div:not(.message-type)');
                if (textDiv) {
                    textDiv.textContent = text;
                }
            }
            MESSAGES.scrollTop = MESSAGES.scrollHeight;
        }

        function addCitations(citations) {
            if (!citations || citations.length === 0) return;

            const lastMessage = MESSAGES.lastElementChild;
            if (!lastMessage) return;

            const bubble = lastMessage.querySelector('.message-bubble');
            const citDiv = document.createElement('div');
            citDiv.className = 'citations';
            citDiv.innerHTML = `
                <strong>📚 Sources:</strong>
                ${citations.map(c => `<div class="citation-item">[${c.chunk_id}] ${c.source}</div>`).join('')}
            `;
            bubble.appendChild(citDiv);
        }

        function addSuggestions(suggestions) {
            if (!suggestions || suggestions.length === 0) return;

            const lastMessage = MESSAGES.lastElementChild;
            if (!lastMessage) return;

            const bubble = lastMessage.querySelector('.message-bubble');
            const sugDiv = document.createElement('div');
            sugDiv.className = 'suggestions';
            sugDiv.innerHTML = `
                <strong>💡 Suggested Questions:</strong>
                <ul class="suggestion-list">
                    ${suggestions.map(q => `<li>${q}</li>`).join('')}
                </ul>
            `;
            bubble.appendChild(sugDiv);
        }

        function setStatus(online) {
            if (online) {
                STATUS.className = 'status-badge online';
                STATUS.textContent = '🟢 Online';
            } else {
                STATUS.className = 'status-badge offline';
                STATUS.textContent = '🔴 Offline';
            }
        }

        async function sendMessage() {
            const message = MESSAGE_INPUT.value.trim();
            if (!message) return;

            // Add user message
            addMessage(message, true);
            MESSAGE_INPUT.value = '';
            SEND_BTN.disabled = true;

            const endpoint = API_ENDPOINT.value.trim();
            const payload = {
                session_id: SESSION_ID.value.trim(),
                message: message,
                lesson_id: LESSON_ID.value.trim(),
                slide_id: SLIDE_ID.value.trim() || null,
            };

            try {
                // Add loading indicator
                const loadingDiv = addMessage('');
                const bubble = loadingDiv.querySelector('.message-bubble');
                bubble.innerHTML = '<div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>';

                const response = await fetch(`${endpoint}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                // Remove loading indicator
                loadingDiv.remove();

                // Add response message
                addMessage('', false, 'response');
                let fullText = '';
                let citations = [];
                let suggestions = [];

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');

                    for (let i = 0; i < lines.length - 1; i++) {
                        const line = lines[i];
                        if (line.startsWith('event: ')) {
                            const eventType = line.replace('event: ', '').trim();
                            const dataLine = lines[++i];

                            if (dataLine && dataLine.startsWith('data: ')) {
                                const dataStr = dataLine.replace('data: ', '').trim();
                                const data = JSON.parse(dataStr);

                                if (eventType === 'token') {
                                    fullText += data.text;
                                    updateLastMessage(fullText);
                                } else if (eventType === 'citation') {
                                    citations.push(data);
                                } else if (eventType === 'suggested_questions') {
                                    suggestions = data.questions;
                                }
                            }
                        }
                    }

                    buffer = lines[lines.length - 1];
                }

                // Add citations and suggestions
                if (citations.length > 0) {
                    addCitations(citations);
                }
                if (suggestions.length > 0) {
                    addSuggestions(suggestions);
                }

                setStatus(true);
            } catch (error) {
                addMessage(`❌ Error: ${error.message}`, false, 'error');
                setStatus(false);
            } finally {
                SEND_BTN.disabled = false;
                MESSAGE_INPUT.focus();
            }
        }

        function clearChat() {
            MESSAGES.innerHTML = '';
        }

        // Send on Ctrl+Enter
        MESSAGE_INPUT.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                sendMessage();
            }
        });

        // Check backend health on load
        window.addEventListener('load', async () => {
            try {
                const endpoint = API_ENDPOINT.value.trim();
                const res = await fetch(`${endpoint}/health`);
                setStatus(res.ok);
                if (res.ok) {
                    addMessage('✅ Connected to AI Agent. Type your question below!', false, 'system');
                }
            } catch (e) {
                setStatus(false);
                addMessage(`❌ Cannot connect to backend at ${API_ENDPOINT.value}. Make sure it's running!`, false, 'error');
            }
        });

        // Focus input on load
        window.addEventListener('load', () => {
            MESSAGE_INPUT.focus();
        });
    </script>
</body>
</html>
