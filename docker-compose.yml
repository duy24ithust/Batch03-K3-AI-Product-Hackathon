name: vlearn-ai-tutor

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: vlearn-agent
    ports:
      - "8000:8000"
    env_file:
      - ./agent/.env
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: vlearn-frontend
    ports:
      - "80:80"
    restart: unless-stopped
